<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANARI 관리자 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f1f5f9;
        }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        .sidebar-link.active {
            background-color: #3b82f6;
            color: white;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Mock Data
        const initialStats = {
            totalSupply: 5000000000,
            collateralValue: 5000000000,
            activeWallets: 1,
            issuanceCap: 5000000000,
        };

        const initialTransactions = [
            { id: 1, type: 'MINT', amount: 5000000000, to: '0xAdmin...Wallet', timestamp: dayjs().subtract(1, 'day').toISOString() },
        ];

        const initialSupplyHistory = [
            { date: dayjs().subtract(7, 'day').format('YYYY-MM-DD'), supply: 0 },
            { date: dayjs().subtract(1, 'day').format('YYYY-MM-DD'), supply: 5000000000 },
        ];

        const initialCollateralData = {
            labels: ['1호 호텔 (인천 주안)'],
            values: [5000000000]
        };

        // Helper Functions
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(value).replace('₩', '') + ' DUSD';
        };
        const formatKRW = (value) => {
            return new Intl.NumberFormat('ko-KR').format(value) + ' 원';
        };

        // Chart Components
        const SupplyHistoryChart = ({ history }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: history.map(h => h.date),
                        datasets: [{
                            label: '총 발행량',
                            data: history.map(h => h.supply),
                            fill: true,
                            backgroundColor: 'rgba(59, 130, 246, 0.2)',
                            borderColor: 'rgba(59, 130, 246, 1)',
                            tension: 0.1,
                            pointBackgroundColor: 'rgba(59, 130, 246, 1)',
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { y: { ticks: { callback: (value) => (value / 1_000_000_000) + 'B' } } },
                        plugins: { legend: { display: false } }
                    }
                });
            }, [history]);

            return <div className="chart-container"><canvas ref={chartRef}></canvas></div>;
        };

        const CollateralChart = ({ data }) => {
            const chartRef = useRef(null);

            useEffect(() => {
                const chartInstance = new Chart(chartRef.current.getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.values,
                            backgroundColor: ['rgba(59, 130, 246, 0.7)', 'rgba(34, 197, 94, 0.7)', 'rgba(234, 179, 8, 0.7)'],
                            borderColor: '#f1f5f9',
                            borderWidth: 2,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } }
                    }
                });
                return () => chartInstance.destroy();
            }, [data]);

            return <div className="chart-container"><canvas ref={chartRef}></canvas></div>;
        };

        // UI Components
        const StatCard = ({ title, value, icon }) => (
            <div className="bg-white p-6 rounded-lg shadow">
                <div className="flex items-center">
                    <div className="bg-blue-100 text-blue-600 p-3 rounded-full mr-4">{icon}</div>
                    <div>
                        <p className="text-sm text-gray-500">{title}</p>
                        <p className="text-2xl font-bold">{value}</p>
                    </div>
                </div>
            </div>
        );

        const MintingForm = ({ onMint }) => {
            const [address, setAddress] = useState('');
            const [amount, setAmount] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!address || !amount || parseFloat(amount) <= 0) {
                    alert('유효한 지갑 주소와 금액을 입력해주세요.');
                    return;
                }
                onMint({ to: address, amount: parseFloat(amount) });
                setAddress('');
                setAmount('');
            };

            return (
                <div className="bg-white p-6 rounded-lg shadow mt-8">
                    <h3 className="text-lg font-semibold mb-4">새로운 DUSD 발행</h3>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                            <label htmlFor="wallet-address" className="block text-sm font-medium text-gray-700">받는 지갑 주소</label>
                            <input type="text" id="wallet-address" value={address} onChange={(e) => setAddress(e.target.value)}
                                className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                placeholder="0x..." />
                        </div>
                        <div>
                            <label htmlFor="amount" className="block text-sm font-medium text-gray-700">발행 금액 (DUSD)</label>
                            <input type="number" id="amount" value={amount} onChange={(e) => setAmount(e.target.value)}
                                className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                placeholder="10000" />
                        </div>
                        <button type="submit" className="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition">
                            발행 실행
                        </button>
                    </form>
                </div>
            );
        };

        const TransactionList = ({ transactions }) => (
            <div className="bg-white p-6 rounded-lg shadow mt-8">
                <h3 className="text-lg font-semibold mb-4">최신 거래 기록</h3>
                <div className="overflow-x-auto">
                    <table className="w-full text-sm text-left text-gray-500">
                        <thead className="text-xs text-gray-700 uppercase bg-gray-50">
                            <tr>
                                <th scope="col" className="px-6 py-3">타입</th>
                                <th scope="col" className="px-6 py-3">금액</th>
                                <th scope="col" className="px-6 py-3">대상 주소</th>
                                <th scope="col" className="px-6 py-3">시간</th>
                            </tr>
                        </thead>
                        <tbody>
                            {transactions.slice(0, 5).map(tx => (
                                <tr key={tx.id} className="bg-white border-b">
                                    <td className="px-6 py-4">
                                        <span className={`px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${tx.type === 'MINT' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                                            }`}>
                                            {tx.type}
                                        </span>
                                    </td>
                                    <td className="px-6 py-4 font-medium">{formatCurrency(tx.amount)}</td>
                                    <td className="px-6 py-4 font-mono truncate max-w-xs">{tx.to}</td>
                                    <td className="px-6 py-4">{dayjs(tx.timestamp).format('YYYY-MM-DD HH:mm')}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        // Main App Component
        function App() {
            const [stats, setStats] = useState(initialStats);
            const [transactions, setTransactions] = useState(initialTransactions);
            const [supplyHistory, setSupplyHistory] = useState(initialSupplyHistory);
            const [collateralData, setCollateralData] = useState(initialCollateralData);

            const handleMint = ({ to, amount }) => {
                if (stats.totalSupply + amount > stats.issuanceCap) {
                    alert('발행 한도를 초과할 수 없습니다. 담보 자산을 추가해주세요.');
                    return;
                }

                const newTransaction = {
                    id: transactions.length + 1,
                    type: 'MINT',
                    amount: amount,
                    to: to,
                    timestamp: new Date().toISOString()
                };

                setStats(prev => ({ ...prev, totalSupply: prev.totalSupply + amount }));
                setTransactions(prev => [newTransaction, ...prev]);

                const today = dayjs().format('YYYY-MM-DD');
                const lastHistory = supplyHistory[supplyHistory.length - 1];

                if (lastHistory.date === today) {
                    const newHistory = [...supplyHistory];
                    newHistory[newHistory.length - 1].supply += amount;
                    setSupplyHistory(newHistory);
                } else {
                    setSupplyHistory(prev => [...prev, { date: today, supply: stats.totalSupply + amount }]);
                }

                alert(`${formatCurrency(amount)}가 성공적으로 발행되었습니다.`);
            };

            return (
                <div className="flex h-screen bg-gray-100">
                    {/* Sidebar */}
                    <div className="hidden md:flex flex-col w-64 bg-white shadow-lg">
                        <div className="flex items-center justify-center h-20 border-b">
                            <div className="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-xl">D</div>
                            <span className="ml-2 text-xl font-bold">DANARI</span>
                        </div>
                        <div className="flex-grow p-4">
                            <a href="#" className="sidebar-link flex items-center p-3 my-2 text-gray-600 rounded-lg hover:bg-blue-500 hover:text-white transition-colors active">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                                <span className="ml-3">대시보드</span>
                            </a>
                        </div>
                    </div>

                    {/* Main Content */}
                    
                    <div className="flex-1 flex flex-col overflow-hidden">
                        <header className="flex justify-between items-center p-6 bg-white border-b">
                            <h1 className="text-2xl font-semibold text-gray-800">관리자 대시보드</h1>
                        </header>
                        <main className="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
                                <StatCard title="총 발행량 (DUSD)" value={formatCurrency(stats.totalSupply)} icon="💰" />
                                <StatCard title="총 담보 자산 가치" value={formatKRW(stats.collateralValue)} icon="🏦" />
                                <StatCard title="발행 한도" value={formatKRW(stats.issuanceCap)} icon="📈" />
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
                                <div className="lg:col-span-3 bg-white p-6 rounded-lg shadow">
                                    <h3 className="text-lg font-semibold mb-4">발행량 추이</h3>
                                    <SupplyHistoryChart history={supplyHistory} />
                                </div>
                                <div className="lg:col-span-2 bg-white p-6 rounded-lg shadow">
                                    <h3 className="text-lg font-semibold mb-4">담보 자산 구성</h3>
                                    <CollateralChart data={collateralData} />
                                </div>
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <MintingForm onMint={handleMint} />
                                <TransactionList transactions={transactions} />
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>

</html>
